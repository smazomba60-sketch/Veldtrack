name: Veldtrack validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: Repeated acceptance loop
        run: python scripts/loop_test.py 1000
      - name: Simulated 1,000-cycle HIL fault sequence
        run: python scripts/hil_runner.py --mode sim --cycles 1000 --artifacts artifacts/hil
